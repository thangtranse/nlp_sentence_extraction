[project]
name = "nlp_practice"
version = "0.1.0"
description = "NLP Practice"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
nlp = "nlp_practice.main:main"
evaluate = "evaluation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_practice", "src/evaluation"]
